<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#1f1d1a">
  <h2 style="margin:0 0 16px;font-size:20px">Reset your anlim.ai password</h2>
  <p style="margin:0 0 20px;line-height:1.5">Someone asked to reset the password for {{ .Email }}. Use the button or the code to choose a new one.</p>
  <p style="margin:0 0 24px"><a href="{{ .ConfirmationURL }}" style="background:#2f5bea;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:8px;display:inline-block;font-weight:bold">Choose a new password</a></p>
  <p style="margin:0 0 8px;line-height:1.5">Or enter this code in the app:</p>
  <p style="margin:0 0 24px;font-size:26px;letter-spacing:6px;font-weight:bold">{{ .Token }}</p>
  <p style="margin:0;color:#6b665e;font-size:13px;line-height:1.5">If it wasn't you, ignore this email: your password stays the same.</p>
</div>
