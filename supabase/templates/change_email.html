<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#1f1d1a">
  <h2 style="margin:0 0 16px;font-size:20px">Confirm your new email address</h2>
  <p style="margin:0 0 20px;line-height:1.5">Confirm that {{ .NewEmail }} should become the email for your anlim.ai account (now {{ .Email }}).</p>
  <p style="margin:0 0 24px"><a href="{{ .ConfirmationURL }}" style="background:#2f5bea;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:8px;display:inline-block;font-weight:bold">Confirm new email</a></p>
  <p style="margin:0 0 8px;line-height:1.5">Or enter this code in the app:</p>
  <p style="margin:0 0 24px;font-size:26px;letter-spacing:6px;font-weight:bold">{{ .Token }}</p>
  <p style="margin:0;color:#6b665e;font-size:13px;line-height:1.5">If you didn't ask for this, ignore this email and your account email stays the same.</p>
</div>
