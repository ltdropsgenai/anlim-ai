# fly.toml app configuration file generated for anlim-worker on 2026-11-19T19:10:04Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'anlim-worker'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[env]
  CHECKER_MAX_JOBS = '2'
  WORKER_ID = 'fly-1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[restart]]
  policy = 'always'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
