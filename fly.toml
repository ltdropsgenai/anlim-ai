# Fly.io config for the worker + checker. @anlim
# No public service on purpose (2026-11-19): the worker only makes outbound calls. With an [http_service], Fly's
# proxy stopped the machine about 5 minutes after every start (seen live 19:22, 19:29, 19:34 UTC), even with
# auto_stop_machines off on the machine, and nothing restarts it. Without a service the proxy never touches it and
# the restart policy keeps it running.
app = "anlim-worker"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  # WORKER_ID is not set here: each machine uses fly-<FLY_MACHINE_ID> (config.js), so 2+ machines never share one
  CHECKER_MAX_JOBS = "1"   # 2 checks at once ran the 2 GB machine out of memory (OOM restarts every ~20 min, 2026-11-19)

# Always on: two machines since 2026-11-25 (flyctl scale count 2), each restarted if it stops. Jobs are claimed with
# FOR UPDATE SKIP LOCKED; plan refresh locks the account row; ready-emails dedupe by idempotency key.
[[restart]]
  policy = "always"

# 2026-11-26 (Londi: "upgrade to a server architecture that will support the workloads"): dedicated CPUs. On
# shared-cpu-2x, sustained matting used up the CPU burst balance (500 s max) and the machine dropped to the 6.25 %
# baseline (Fly docs, machines/cpu-performance): Atud Clinton's 6-child cartoon end image went from ~12 s per image's
# cut-outs on an idle machine to over 5 min per try. performance-2x is never throttled. Each machine runs one heavy
# check at a time (CHECKER_MAX_JOBS = 1), so add machines (flyctl scale count N) for more people at once.
[[vm]]
  size = "performance-2x"
  memory = "4gb"   # 2026-11-23: the checker ran out of memory on 2 GB (oom_killed during an end-frame check)
